name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Lock file is up to date
        run: uv lock --check
      - name: Pinned requirements.txt matches the lock
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements.txt
          git diff --exit-code requirements.txt
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Tests
        run: uv run --no-sync pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend
        run: uv sync --frozen --extra dev
      - name: Install frontend
        working-directory: apps/web
        run: npm ci
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: apps/web
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobuser
          POSTGRES_PASSWORD: jobpass
          POSTGRES_DB: jobs
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U jobuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://jobuser:jobpass@localhost:5432/jobs
      AUTO_CREATE_TABLES: "false"
      TEST_POSTGRES_URL: postgresql+psycopg://jobuser:jobpass@localhost:5432/jobs
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head
      - name: Verify downgrade/upgrade
        run: |
          uv run --no-sync alembic downgrade base
          uv run --no-sync alembic upgrade head
      - name: Full test suite (integration tests included)
        run: uv run --no-sync pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra dev
      - name: Python dependency audit
        run: |
          uv pip install pip-audit
          uv run --no-sync python -m pip_audit --skip-editable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Node dependency audit
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high

  image-scan:
    # Baseline: base images may carry unfixed OS vulns; report until triaged,
    # then remove continue-on-error to make it blocking.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: jobseek-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/web
          load: true
          tags: jobseek-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: jobseek-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: jobseek-web:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
